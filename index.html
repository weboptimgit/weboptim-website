<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    
    <!-- DNS prefetch and preconnect to external resources for faster loading -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    
    <!-- Preload critical font for LCP -->
    <link rel="preload" href="https://fonts.gstatic.com/s/outfit/v11/QGYvz_MVcBeNP4NJuktqQ4E.woff2" as="font" type="font/woff2" crossorigin />
    
    <!-- Font stylesheet with display=swap for fast text rendering -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" />
    
    <!-- Static fallback meta tags for crawlers that don't execute JS -->
    <title>WebOptim | Tvorba webov, SEO & Digitálny marketing</title>
    <meta name="description" content="Tvoríme rýchle, moderné weby a e-shopy. Pomôžeme vám s SEO, PPC reklamou a digitálnym marketingom. Získajte viac zákazníkov online." />
    <meta name="author" content="WebOptim" />
    <meta name="keywords" content="tvorba webov, tvorba webových stránok, SEO optimalizácia, digitálny marketing, e-shop, web design, WordPress, WooCommerce" />
    
    <!-- Robots - allow indexing -->
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph fallback -->
    <meta property="og:title" content="WebOptim | Tvorba webov, SEO & Digitálny marketing" />
    <meta property="og:description" content="Tvoríme rýchle, moderné weby a e-shopy. Pomôžeme vám s SEO, PPC reklamou a digitálnym marketingom. Získajte viac zákazníkov online." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://www.weboptim.eu/img/weboptim-profile-pic.png" />
    <meta property="og:url" content="https://weboptim.sk/" />
    <meta property="og:site_name" content="WebOptim" />
    <meta property="og:locale" content="sk_SK" />
    <meta property="og:locale:alternate" content="cs_CZ" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter Card fallback -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WebOptim | Tvorba webov, SEO & Digitálny marketing" />
    <meta name="twitter:description" content="Tvoríme rýchle, moderné weby a e-shopy. Pomôžeme vám s SEO, PPC reklamou a digitálnym marketingom." />
    <meta name="twitter:image" content="https://www.weboptim.cz/img/weboptim-profile-pic.png" />
    
    <!-- Canonical -->
    <link rel="canonical" href="https://weboptim.sk/" />
    
    <!-- Hreflang for multi-domain language setup -->
    <link rel="alternate" hreflang="en" href="https://weboptim.eu/" />
    <link rel="alternate" hreflang="cs" href="https://weboptim.cz/" />
    <link rel="alternate" hreflang="sk" href="https://weboptim.sk/" />
    <link rel="alternate" hreflang="x-default" href="https://weboptim.sk/" />
    
    <!-- RSS Feed autodiscovery -->
    <link rel="alternate" type="application/rss+xml" title="WebOptim Blog RSS Feed" href="/rss.xml" />
    <link rel="alternate" type="application/rss+xml" title="WebOptim Blog RSS (CZ)" href="/rss-cz.xml" />
    <link rel="alternate" type="application/rss+xml" title="WebOptim Blog RSS (SK)" href="/rss-sk.xml" />
    
    <!-- Static Organization JSON-LD schema (fallback) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "WebOptim",
      "legalName": "Smart Coach s.r.o.",
      "url": "https://weboptim.sk",
      "logo": "https://www.weboptim.cz/img/weboptim-profile-pic.png",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Príčna 1892/4",
        "addressLocality": "Praha",
        "postalCode": "110 00",
        "addressCountry": "CZ"
      },
      "sameAs": [
        "https://www.facebook.com/weboptim.sk",
        "https://www.instagram.com/weboptim.sk"
      ]
    }
    </script>
    
    <!-- Static WebSite JSON-LD schema (fallback) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "WebOptim",
      "url": "https://weboptim.sk",
      "inLanguage": ["sk", "cs", "en"],
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://weboptim.sk/blog?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    
    <!-- Critical inline CSS for faster FCP -->
    <style>
      :root {
        --background: 222 47% 5%;
        --foreground: 210 40% 98%;
        --primary: 187 82% 60%;
      }
      html { scroll-behavior: smooth; }
      body { 
        margin: 0; 
        background: hsl(222 47% 5%); 
        color: hsl(210 40% 98%);
        font-family: 'Outfit', system-ui, sans-serif;
      }
      #root { min-height: 100vh; }
      /* Skeleton loader for initial paint */
      .initial-loader {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: hsl(222 47% 5%);
      }
    </style>
    
    <!-- Modulepreload for critical JS -->
    <link rel="modulepreload" href="/src/main.tsx" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
